# Site settings
title: blank
first_name: W. D'Arcy
middle_name: 
last_name: Kenworthy
contact_note: >
  Reach me via email or LinkedIn.
description: Quantitative researcher specializing in statistical modeling, time-series analysis, and systematic bias correction. Open to quantitative research roles in finance.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
keywords: quantitative research, statistical modeling, time series, bayesian statistics
lang: en
icon: ⚛️

url: https://darcykenworthy.github.io
baseurl:
last_updated: false
back_to_top: true

# Theme
repo_theme_light: default
repo_theme_dark: dark
repo_trophies:
  enabled: false

# Layout
navbar_fixed: true
footer_fixed: true
search_enabled: false
max_width: 930px

# Open Graph & Schema.org
serve_og_meta: false
serve_schema_org: false

# Analytics (all disabled)
google_analytics:
cronitor_analytics:
pirsch_analytics:
openpanel_analytics:
google_site_verification:
bing_site_verification:

# Blog (disabled)
blog_name: al-folio
blog_description: a simple whitespace theme for academics
permalink: /blog/:year/:title/
pagination:
  enabled: false
related_blog_posts:
  enabled: false

# Collections
collections:
  news:
    defaults:
      layout: post
    output: true
  projects:
    output: true

# Markdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"

# Includes & excludes
include: ["_pages"]
exclude:
  - bin/
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - README.md
  - vendor
  - repositories.md
keep_files:
  - CNAME
  - .nojekyll

# Plug-ins (minimal set)
plugins:
  - jekyll-archives-v2
  - jekyll-email-protect
  - jekyll-imagemagick
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll/scholar
  - jekyll-sitemap

sass:
  style: compressed

# Jekyll Minifier
jekyll-minifier:
  compress_javascript: false

# Jekyll Archives (minimal)
jekyll-archives:
  posts:
    enabled: [year]
    permalinks:
      year: "/blog/:year/"

# Jekyll Scholar (your publications)
scholar:
  last_name: [Kenworthy]
  first_name: [W. D'Arcy, D'Arcy, W., William]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending

# Publication badges
enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false

filtered_bibtex_keywords:
  [abbr, abstract, arxiv, bibtex_show, pdf, selected, supp]

max_author_limit: 3
more_authors_animation_delay: 10
enable_publication_thumbnails: false

# External links
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank

# Images
imagemagick:
  enabled: true
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
  output_formats:
    webp: "-quality 85"

lazy_loading_images: true

# Optional Features
enable_google_analytics: false
enable_masonry: true
enable_math: true
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_project_categories: true
enable_medium_zoom: true
enable_progressbar: true

# Third-party libraries (required by al-folio plugin)
third_party_libraries:
  download: false
  jquery:
    integrity:
      js: "sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
    url:
      js: "https://cdn.jsdelivr.net/npm/jquery@{{version}}/dist/jquery.min.js"
    version: "3.6.0"
  mathjax:
    integrity:
      js: "sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI="
    url:
      js: "https://cdn.jsdelivr.net/npm/mathjax@{{version}}/es5/tex-mml-chtml.js"
    version: "3.2.2"
  masonry:
    integrity:
      js: "sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI="
    url:
      js: "https://cdn.jsdelivr.net/npm/masonry-layout@{{version}}/dist/masonry.pkgd.min.js"
    version: "4.2.2"
  mdb:
    integrity:
      css: "sha256-jpjYvU3G3N6nrrBwXJoVEYI/0zw8htfFnhT9ljN3JJw="
      js: "sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA="
    url:
      css: "https://cdn.jsdelivr.net/npm/mdbootstrap@{{version}}/css/mdb.min.css"
      js: "https://cdn.jsdelivr.net/npm/mdbootstrap@{{version}}/js/mdb.min.js"
    version: "4.20.0"
  medium_zoom:
    integrity:
      js: "sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc="
    url:
      js: "https://cdn.jsdelivr.net/npm/medium-zoom@{{version}}/dist/medium-zoom.min.js"
    version: "1.1.0"
  imagesloaded:
    integrity:
      js: "sha256-htrLFfZJ6v5udOG+3kNLINIKh2gvoKqwEhHYfTTMICc="
    url:
      js: https://cdn.jsdelivr.net/npm/imagesloaded@{{version}}/imagesloaded.pkgd.min.js
    version: "5.0.0"

# Get JSON data
jekyll_get_json:
  - data: resume
    json: assets/json/resume.json

jsonresume:
  - basics
  - work
  - education
  - publications
  - skills